name: Sync pricing data

on:
  schedule:
    - cron: '23 8 * * *'   # Daily at 08:23 UTC
  workflow_dispatch:         # Manual trigger

permissions:
  contents: write

concurrency:
  group: sync-pricing
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch plans and generate pricing.html
        env:
          CHEGATTA_API_URL: https://app.chegatta.com/api
        run: node scripts/generate-pricing.js

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet pricing.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pricing.html
          git commit -m "chore: sync pricing data from Laravel app"
          git push
